[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "openaudit"
version = "0.1.0"
description = "Open standard for AI agent audit logs — Approval-First, Verifiable Evidence, Offline-First, Risk-Native"
authors = [{name = "OpenAudit Community"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.8"
keywords = ["audit", "ai-safety", "governance", "compliance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "click>=8.0.0",
    "jsonschema>=4.0.0",
]

[project.scripts]
openaudit = "openaudit.cli:cli"

[tool.setuptools.packages.find]
include = ["openaudit*"]
